mutation ($actor: ID!, $input: CreateTransactionInput!) {
  createTransaction(actorCompanyUserId: $actor, input: $input) {
    id
    amount
    transactionType
    transactionDate
    capturedAt
    capturedBy
    isActive
    account {
      id
    }
    concept {
      id
    }
    capturedByUser {
      id
    }
  }
}
